name: car_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0-265.0.dev

dependencies:
  connectivity_plus: ^6.1.5
  country_code_picker: ^3.4.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  flutter_spinkit: ^5.2.2
  flutter_svg: any
  fluttertoast: ^8.2.12
  get_it: ^8.2.0
  logger: ^2.6.1
  pinput: ^5.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_images.dart

flutter_native_splash:
  android: true
  ios: true
  web: true
  color: "#E3263D"
  image: assets/splash/splash.png

  android_12:
    image: assets/splash/splash_12.png
    color: "#E3263D"
